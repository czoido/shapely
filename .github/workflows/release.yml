name: Build and publish

on:
  push:
    branches:
      - main  # just build the sdist & wheel, skip release
      - conan-py-build
    tags:
      - "*"
  pull_request:  # also build on PRs touching this file
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "conanfile.py"
      - "CMakeLists.txt"
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build source tarball
        run: |
          pip install --upgrade pip build conan-py-build twine
          python -m build --sdist
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: ./dist/*.tar.gz
          retention-days: 30
          compression-level: 0

  build_wheels:
    name: Wheels · ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — builds manylinux + musllinux in one job
          - os: ubuntu-latest
            arch: x86_64
          # Linux aarch64 via QEMU
          - os: ubuntu-latest
            arch: aarch64
          # macOS
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          # Windows
          - os: windows-2025
            arch: AMD64
          - os: windows-2025
            arch: x86
            host_profile: profiles/win-x86.profile
          - os: windows-11-arm
            arch: ARM64
            host_profile: profiles/win-arm64.profile

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU (Linux aarch64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64' }}

      - name: Activate MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: ${{ startsWith(matrix.os, 'windows') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "pp* *_i686 *_ppc64le *_s390x"
          CIBW_CONFIG_SETTINGS: ${{ matrix.host_profile && format('host-profile={0}', matrix.host_profile) || '' }}
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel} --add-path {project}\build\.conan-libs
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs shapely.tests

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
          skip-existing: true
