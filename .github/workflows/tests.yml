name: Tests

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} Py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: 1.23.5
          - os: ubuntu-latest
            python: "3.12"
            numpy: 1.26.4
            matplotlib: true
            doctest: true
            extra_pytest_args: "-W error"
          - os: ubuntu-latest
            python: "3.13"
            numpy: 2.1.3
          - os: macos-latest
            python: "3.12"
            numpy: 1.26.4
          - os: windows-latest
            python: "3.12"
            numpy: 1.26.4

    steps:
      - name: Checkout Shapely
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy==${{ matrix.numpy }} pytest pytest-cov

      - name: Install optional test dependencies
        run: |
          pip install matplotlib
        if: ${{ matrix.matplotlib }}

      - name: Install optional doctest dependencies
        run: |
          pip install pyproj scipy-doctest
        if: ${{ matrix.doctest }}

      - name: Build and install Shapely
        run: pip install -v .

      - name: Run tests
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import shapely; print(f'GEOS version: {shapely.geos_version_string}')"
          pytest --pyargs shapely.tests -r a ${{ matrix.extra_pytest_args }}

      - name: Run doctests on manual docs
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.doctest }}
        working-directory: ${{ runner.temp }}
        run: python -m pytest --doctest-modules ${{ github.workspace }}/docs/*.rst

      - name: Run doctests on shapely module
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.doctest }}
        working-directory: ${{ runner.temp }}
        run: pytest --doctest-modules --pyargs shapely --ignore=shapely/tests
